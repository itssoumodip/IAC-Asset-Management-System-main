name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: iac_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: iac_test
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U iac_ci -d iac_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports: [11025:1025, 18025:8025]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://iac_ci:disposable_ci_only@127.0.0.1:55432/iac_test
      TEST_DATABASE_URL: postgresql://iac_ci:disposable_ci_only@127.0.0.1:55432/iac_test
      MIGRATION_DATABASE_URL: postgresql://iac_ci:disposable_ci_only@127.0.0.1:55432/iac_test
      APP_ORIGIN: http://127.0.0.1:5173
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 11025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run db:migrate -w @iac/api -- --test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:setup
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
# Pin reviewed action SHAs/image digests in organizational release policy.
# Production deployment uses a separate controlled staging/promotion workflow.
